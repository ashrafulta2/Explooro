name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 on 2026-10-19, which would
    # change the OS under native modules like argon2 with no code change. Bump this deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Exact versions from package-lock.json; fails if the lockfile is out of sync.
      - run: npm ci

      # .env is gitignored. The example documents every variable and defaults to mock drivers,
      # so tests and the build run with no database, Redis or external service.
      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Test (client + server)
        run: npm test

      # Includes the performance budget gate (150KB JS / 70KB CSS gzipped) and the prerender step.
      - name: Build
        run: npm run build

  # The test suite mocks the database, so a query naming a column that does not exist passes it.
  # This job migrates a real PostgreSQL 16 and PREPAREs every static SQL statement against it.
  # WHY the runner's own PostgreSQL and not a service container: no Docker before Prompt 12.7.
  sql-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://explooro:explooro@localhost:5432/explooro_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER explooro WITH PASSWORD 'explooro';"
          sudo -u postgres psql -c "CREATE DATABASE explooro_ci OWNER explooro;"

      - name: Apply migrations
        run: npm run migrate --workspace server

      - name: Prepare every SQL statement against the schema
        run: npm run check:sql --workspace server
