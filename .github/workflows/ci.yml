name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 on 2026-10-19, which would
    # change the OS under native modules like argon2 with no code change. Bump this deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Exact versions from package-lock.json; fails if the lockfile is out of sync.
      - run: npm ci

      # .env is gitignored. The example documents every variable and defaults to mock drivers,
      # so tests and the build run with no database, Redis or external service.
      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Test (client + server)
        run: npm test

      # Includes the performance budget gate (150KB JS / 70KB CSS gzipped) and the prerender step.
      - name: Build
        run: npm run build
