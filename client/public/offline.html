<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — Explooro</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fbfdfe;
      color: #192026;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0c1217; color: #fbfdfe; }
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #e1e5e8;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(12px);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: rgba(25, 32, 38, 0.8); border-color: #2b353f; }
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fdf2f8;
      color: #a6337e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 24px;
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary {
      background: #a6337e;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e1e5e8;
      color: #192026;
    }
    .btn:active { transform: scale(0.98); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #fee2e2;
      color: #991b1b;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="status-badge">
      <span>●</span> No Internet Connection
    </div>
    <h1>You are currently offline</h1>
    <p>Don't worry! Your pending cart changes and drafts are safely saved offline. Reconnecting will automatically sync your updates.</p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
      <a href="/" class="btn btn-secondary">Browse Cached Marketplace</a>
      <a href="/cart" class="btn btn-secondary">View Offline Cart</a>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
